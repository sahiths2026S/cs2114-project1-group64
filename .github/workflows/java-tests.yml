name: Java tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and run JUnit tests
        run: ./scripts/test.sh --details=summary
      - name: Run the presentation demo
        run: ./scripts/run.sh --demo < docs/demo-input.txt
