<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">Pill Roulette system diagram</title>
<desc id="desc">Main launches Game. Game coordinates UserInput, GameUi, two Player objects, and a deque of Pill objects. Input and UI connect to the shared terminal.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#555"/></marker></defs>
<rect width="960" height="550" fill="#f5f5f5"/>
<g stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M480 93 V150"/><path d="M360 192 H165 V265"/><path d="M600 192 H795 V265"/>
<path d="M435 225 V270 H400 V365"/><path d="M525 225 V270 H560 V365"/>
<path d="M165 335 V485 H360"/><path d="M795 335 V485 H600"/>
</g>
<g fill="#fff" stroke="#666" stroke-width="1.5">
<rect x="365" y="28" width="230" height="65"/>
<rect x="360" y="150" width="240" height="75"/>
<rect x="50" y="265" width="230" height="70"/>
<rect x="680" y="265" width="230" height="70"/>
<rect x="285" y="365" width="210" height="70"/>
<rect x="515" y="365" width="245" height="70"/>
<rect x="360" y="455" width="240" height="60"/>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#333">
<text x="480" y="55" font-size="23">Main</text><text x="480" y="79" font-size="17">launch options</text>
<text x="480" y="181" font-size="24">Game</text><text x="480" y="208" font-size="18">rules and turn loop</text>
<text x="165" y="294" font-size="23">UserInput</text><text x="165" y="320" font-size="17">read and validate</text>
<text x="795" y="294" font-size="23">GameUi</text><text x="795" y="320" font-size="17">state and results</text>
<text x="390" y="393" font-size="22">2 Player objects</text><text x="390" y="418" font-size="17">health</text>
<text x="637" y="393" font-size="22">Deque&lt;Pill&gt;</text><text x="637" y="418" font-size="17">hidden cyanide/sugar order</text>
<text x="480" y="491" font-size="22">Shared terminal</text>
</g>
</svg>
